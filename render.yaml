services:
  - type: web
    name: acme-rag-frontend
    runtime: python
    plan: free
    region: frankfurt
    branch: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_NAME
        value: llama3.2:1b
      - key: EMBED_MODEL
        value: nomic-embed-text
      - key: CHROMA_DIR
        value: ./chroma_db
      - key: DOCS_DIR
        value: ./docs
      - key: TOP_K
        value: "4"
